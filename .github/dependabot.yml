# Weekly grouped PRs for Go modules and GitHub Actions, auto-merged by deps.yml
# when ci passes. The go directive is bumped by deps.yml instead.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
