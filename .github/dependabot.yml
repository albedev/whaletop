# Weekly grouped PRs for Go modules (auto-merged by deps.yml when ci passes) and
# GitHub Actions (merged by hand). The go directive is bumped by deps.yml instead.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
